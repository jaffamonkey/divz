<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>No-one can separate me and Cleo - Fuck Off World</title>
      <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      /* background: rgba(0, 0, 0, 1); */
    }

    .video-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .video-bg iframe {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 177.78vh; /* 16:9 */
      height: 100vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      color: white;
      cursor: pointer;
      z-index: 2;
      text-align: center;
    }

    .overlay.hidden {
      display: none;
    }

    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 50vh;
      text-shadow: 0 0 6px black;
    }
  </style>
</head>
<body>

  <div class="video-bg">
    <iframe id="player"
      src="https://www.youtube.com/embed/nSevCSWv1AI?enablejsapi=1&autoplay=1&mute=1&loop=1&playlist=gKz3W_Ukh44&controls=0&rel=0"
      frameborder="0"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>
  </div>

  <div class="overlay" id="overlay">
    <div>
      <h4>Click to enable sound 🔊</h4>
      <!-- <p>Background video will play with audio</p> -->
    </div>
  </div>

  <!-- <div class="content">
    <h3>After nearly losing Cleo to a catnapper to someone with an obsession with him, I have made decision to forgive you in general. But I still want my fucking stuff back. Cleo needs his post. And I need some more clothes.</h3>
  </div> -->

  <script>
    const overlay = document.getElementById('overlay');
    const player = document.getElementById('player');

    overlay.addEventListener('click', () => {
      overlay.classList.add('hidden');
      player.contentWindow.postMessage(
        JSON.stringify({
          event: "command",
          func: "unMute"
        }),
        "*"
      );
    });
  </script>

</body>
</html>
